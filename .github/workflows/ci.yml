name: Validate CareContext
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carecontext-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest --junitxml=test-results.xml
      - run: carecontext evaluate --output evaluations/ci-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-python-${{ matrix.python }}
          path: |
            evaluations/ci-results.json
            test-results.xml
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: python scripts/check_release.py
