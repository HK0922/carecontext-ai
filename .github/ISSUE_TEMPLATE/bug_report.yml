name: Bug report
description: Report a reproducible software bug using synthetic examples only.
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include case ID, question, mode, and environment. Do not include real patient data or credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
