[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carecontext"
version = "0.2.0"
description = "An evidence-first clinical record review prototype using synthetic cases"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Harikrishna Trivedi"}]
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx[socks]==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[project.scripts]
carecontext = "carecontext.cli:main"

[tool.setuptools.packages.find]
include = ["carecontext*"]

[tool.setuptools.package-data]
carecontext = ["data/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
