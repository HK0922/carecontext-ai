services:
  carecontext:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CARECONTEXT_MODEL: ${CARECONTEXT_MODEL:-}
    volumes:
      - carecontext-data:/app/.data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  carecontext-data:
